name: Landing page

# apps/landing is plain html, css and a little js, so there is nothing to
# build: the folder is uploaded as it is and served by GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing
      - id: deployment
        uses: actions/deploy-pages@v4
