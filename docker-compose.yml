services:
  postgres:
    image: postgres:17-alpine
    container_name: reader-postgres
    environment:
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: reader
      POSTGRES_DB: reader
    ports:
      - "55432:5432"
    volumes:
      - reader-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader -d reader"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reader-pgdata:
