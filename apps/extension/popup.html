<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; --accent: #ef4056; }
      body {
        width: 290px; margin: 0; padding: 14px;
        font: 13px/1.45 system-ui, sans-serif;
        background: Canvas; color: CanvasText;
      }
      #title { font-weight: 600; margin-bottom: 2px; }
      #host { color: GrayText; font-size: 11px; margin-bottom: 12px; word-break: break-all; }
      button {
        width: 100%; padding: 8px; border: 0; border-radius: 999px;
        background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #result { margin-top: 10px; font-size: 12px; }
      #result a { color: var(--accent); }
      .error { color: #b00020; }
      #options { display: block; margin-top: 12px; font-size: 11px; color: GrayText; }
    </style>
  </head>
  <body>
    <div id="title">…</div>
    <div id="host"></div>
    <button id="save" disabled>Save</button>
    <div id="result"></div>
    <a id="options" href="#">Options</a>
    <script src="popup.js"></script>
  </body>
</html>
