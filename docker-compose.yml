services:
  postgres:
    image: postgres:17-alpine
    container_name: zenow-postgres
    environment:
      POSTGRES_USER: zenow
      POSTGRES_PASSWORD: zenow
      POSTGRES_DB: zenow
    ports:
      - "55432:5432"
    volumes:
      - zenow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenow -d zenow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zenow-pgdata:
