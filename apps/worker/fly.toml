app = "zenow-worker"
# Same region as the Neon database (eu-west-2), so the queue poll is a
# local round trip rather than a transatlantic one.
primary_region = "lhr"

# No [build] section on purpose. A dockerfile path here would resolve against
# this file's own directory, but the worker depends on three workspace packages
# so the build context has to be the repo root. Deploy from the root with:
#   fly deploy . --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Fly's proxy only counts http traffic, so it would happily stop a machine
  # that is mid-job. Keeping one alive also keeps the 30s poll running, which
  # is what makes a missed kick harmless.
  min_machines_running = 1

  # Array of tables, not a named sub-table: flyctl rejects the latter.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 512 is enough until yt-dlp runs; ffmpeg in the image pushes it over.
  memory_mb = 1024
